; Headless GPU1 only: measured ~1 GiB free at peak. Both context overrides are required, or the
; DFlash draft context is sized to 131072. Channel-format template: reasoning_strength, not Qwen kwargs.
[muse-glimmer-30b]
model = F:/AI/models/llm/unsloth/Muse-Glimmer-30B-GGUF/Muse-Glimmer-30B-UD-Q4_K_XL.gguf
mmproj = F:/AI/models/llm/unsloth/Muse-Glimmer-30B-GGUF/mmproj-kquant.gguf
device = CUDA1
spec-draft-device = CUDA1
split-mode = none
spec-draft-model = F:/AI/models/llm/unsloth/Muse-Glimmer-30B-GGUF/dflash-kquant.gguf
spec-type = draft-dflash
spec-draft-n-max = 15
n-gpu-layers-draft = 99
override-kv = muse-glimmer.context_length=int:262144,dflash.context_length=int:262144
ctx-size = 262144
batch-size = 4096
ubatch-size = 512
cache-ram = 0
reasoning-budget = -1
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.0
repeat-penalty = 1.0
chat-template-kwargs = {"reasoning_strength": "high"}

