; llama.cpp router presets. Key = long CLI flag without the leading "--".
; Provenance and per-model rationale: F:\AI\models\llm\HANDOFF.md
; Never put sampler keys in [*]: presence-penalty inverts between thinking (0.0) and instruct (1.5).

[*]
jinja = true
flash-attn = on
n-gpu-layers = 999
threads = 8
cache-type-k = q8_0
cache-type-v = q8_0
; ctx-size divides across slots.
parallel = 1
; --fit defaults to on and rewrites unset args; keep measured presets exactly as written.
fit = off

; club-3090 unsloth-ud-q5kxl/mtp-vision.yml lane, measured on these cards.
[qwen3.8-27b]
model = F:/AI/models/llm/unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q5_K_XL.gguf
mmproj = F:/AI/models/llm/unsloth/Qwen3.8-27B-GGUF/mmproj-F16.gguf
ctx-size = 262144
batch-size = 4096
; Crash fix, not a default: mmproj + draft-mtp aborts in the CUDA VMM pool during image encode above 512.
ubatch-size = 512
split-mode = layer
; GPU0 carries the desktop; the MTP draft context is pinned to the last card.
tensor-split = 0.45,0.55
spec-type = draft-mtp
spec-draft-n-max = 2
ctx-checkpoints = 32
; Host RAM, contested by ComfyUI. Measure before raising.
cache-ram = 0
reasoning = on
reasoning-format = deepseek
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
; reasoning_effort accepts only low / medium / xhigh; anything else is an HTTP 500.
chat-template-kwargs = {"enable_thinking": true, "preserve_thinking": true, "reasoning_effort": "xhigh"}

; Same file family and embedded MTP head (blk.64.nextn.*) as [qwen3.8-27b]; ~0.3 GiB heavier. Derived, not measured.
[qwen3.8-fable-q5]
model = F:/AI/models/llm/DavidAU/Qwen3.8-27B-TURBO-Fable-Cold-Fusion-735-882-Heretic-Uncensored-NEO-CODER-MAX-MTP-GGUF/Qwen3.8-27B-TurboFCFusion-735-882-Here-Uncen-NEO-CODER-MAX-MTP-Q5_K_M.gguf
mmproj = F:/AI/models/llm/DavidAU/Qwen3.8-27B-TURBO-Fable-Cold-Fusion-735-882-Heretic-Uncensored-NEO-CODER-MAX-MTP-GGUF/mmproj-F16.gguf
ctx-size = 262144
batch-size = 4096
; mmproj + draft-mtp: see [qwen3.8-27b].
ubatch-size = 512
split-mode = layer
tensor-split = 0.45,0.55
spec-type = draft-mtp
spec-draft-n-max = 2
ctx-checkpoints = 32
cache-ram = 0
reasoning = on
reasoning-format = deepseek
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
chat-template-kwargs = {"enable_thinking": true, "preserve_thinking": true, "reasoning_effort": "xhigh"}

; The unsloth Q4_K_XL has no MTP head (no nextn tensors), so no drafter.
; Thinking off: on vs off was a wash on the 8-pack and thinking costs heavy latency.
[qwen3.6-35b-a3b]
model = F:/AI/models/llm/unsloth/Qwen3.6-35B-A3B-GGUF/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
mmproj = F:/AI/models/llm/unsloth/Qwen3.6-35B-A3B-GGUF/mmproj-BF16.gguf
ctx-size = 262144
batch-size = 4096
ubatch-size = 1024
split-mode = layer
tensor-split = 0.55,0.45
cache-ram = 0
reasoning = off
reasoning-format = deepseek
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
; CoT-repetition safety net.
repeat-penalty = 1.1
repeat-last-n = 256
chat-template-kwargs = {"preserve_thinking": false}

; Non-thinking model; the template has no thinking switch. Sampler is the model card's, unmeasured here.
[qwen3-coder-30b]
model = F:/AI/models/llm/Qwen/Qwen3-Coder-30B-A3B-Instruct/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
ctx-size = 262144
batch-size = 4096
ubatch-size = 1024
split-mode = layer
tensor-split = 0.45,0.55
cache-ram = 0
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0.0
repeat-penalty = 1.05

