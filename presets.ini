; llama.cpp router presets. Key = long CLI flag without the leading "--".
; Provenance and per-model rationale: F:\AI\models\llm\HANDOFF.md
; Never put sampler keys in [*]: presence-penalty inverts between thinking (0.0) and instruct (1.5).

[*]
jinja = true
flash-attn = on
n-gpu-layers = 999
threads = 8
cache-type-k = q8_0
cache-type-v = q8_0
; ctx-size divides across slots.
parallel = 1
; --fit defaults to on and rewrites unset args; keep measured presets exactly as written.
fit = off

; club-3090 unsloth-ud-q5kxl/mtp-vision.yml lane, measured on these cards.
[qwen3.8-27b]
model = F:/AI/models/llm/unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q5_K_XL.gguf
mmproj = F:/AI/models/llm/unsloth/Qwen3.8-27B-GGUF/mmproj-F16.gguf
ctx-size = 262144
batch-size = 4096
; Crash fix, not a default: mmproj + draft-mtp aborts in the CUDA VMM pool during image encode above 512.
ubatch-size = 512
split-mode = layer
; GPU0 carries the desktop; the MTP draft context is pinned to the last card.
tensor-split = 0.45,0.55
spec-type = draft-mtp
spec-draft-n-max = 2
ctx-checkpoints = 32
; Host RAM, contested by ComfyUI. Measure before raising.
cache-ram = 0
reasoning = on
reasoning-format = deepseek
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
; reasoning_effort accepts only low / medium / xhigh; anything else is an HTTP 500.
chat-template-kwargs = {"enable_thinking": true, "preserve_thinking": true, "reasoning_effort": "xhigh"}

; [qwen3.8-27b] with the external DFlash2 drafter instead of MTP (MTP + an external drafter crashes, llama.cpp #27897).
; Q4 n4 won the 2026-09-14 sweep: +17% net over MTP n2, growing with depth (128k code 42.5 vs 31.0 t/s).
; Q8 drafter was a tie; n5 lost. The drafter's 8-token block caps n-max at 7.
; Tie-break re-run 2026-09-14 (8 runs, 1.9k+128k depths): Q4-n4/Q8-n4/Q4-n3 stayed a wash on aggregate
; harmonic mean (44-46 t/s, well inside the ~10-20 t/s per-cell run spread at temp 1.0) and Q8-n3 lost
; outright. At 128k specifically -- the region this lane exists for -- Q4-n4 kept the lead on both
; code (39.8) and essay (42.8) over all three challengers. No change; kept as Q4-n4.
; HANDOFF.md Sec.4.4 fill ladder, 2026-09-14: needle recalled exactly at 63.2% / 86.6% / 94.5% of
; n_ctx (the 90%/99% filler targets undershot -- the char/token ratio measured at 60k chars doesn't
; hold at 900k+; use ~4.3 chars/token, not 3.88, to hit deep targets). Zero pipeline fallbacks.
[qwen3.8-27b-dflash2]
model = F:/AI/models/llm/unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q5_K_XL.gguf
